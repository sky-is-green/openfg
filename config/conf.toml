# openfg configuration
#
# The layer is inactive unless enabled = true, or OPENFG_ENABLE=1 is set.
# The file is read once per process, early in device startup.

[openfg]
enabled = false

# Vulkan device used for interpolation: "auto", a PCI address such as
# "0000:01:00.0", a device name, or "vendor:device".
gpu = "auto"

# true: run the backend on the GPU above and share frames with the display
# GPU over DMA-BUF. false: run on the display GPU with OpaqueFd.
cross_gpu = false

# Generated frames per real frame: 2, 3 or 4.
multiplier = 2

# Manual activation threshold. 0 = no manual threshold; the presented cap
# still applies. The effective threshold is min(target_fps,
# max_presented_fps / multiplier). Above it, the layer stays off.
target_fps = 0

# Cap presented frames per second and set the automatic activation threshold:
# source threshold = this value / multiplier. -1 = detected display refresh
# (the efficiency default), 0 = off, or an explicit value such as 165.
max_presented_fps = 0

# Half-resolution flow: for flow it also narrows refinement; for ffx it runs
# the five-level half-size FidelityFX search. About 2x faster, softer edges.
performance_mode = false

# Generator: ffx (AMD FidelityFX optical flow, default), flow (openfg optical
# flow), blend (linear A/B), hold (repeat the current frame), or off (layer
# loaded but no generation; useful for timing). Devices without FidelityFX
# subgroup/format support fall back to flow with a log line.
generator = "ffx"

# Generation pacing. "adaptive" waits out the measured threshold dwell;
# "capped" assumes the app is capped at refresh / multiplier and starts
# generating immediately, with only the over-refresh stop as a safety.
pacing = "adaptive"

# Enable present-id/wait instrumentation. This can make the compositor pace
# presents, so leave it off for normal use.
present_timing = false

# Log generated frames and present results to stderr.
debug = false

[processes]
# Enable only for these process names. Empty means all processes.
# '*' and '?' wildcards are supported; matching is case-insensitive.
include = []

# Always keep frame generation off for these processes.
exclude = []

[video]
# Players that should use the video profile. Empty disables it.
# These names are matched in addition to [processes].include, and the profile
# overrides multiplier, target_fps and performance_mode below.
processes = []

multiplier = 4
target_fps = 0
performance_mode = false

# Detect scene cuts and show the current frame instead of blending them.
safe = true
