name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++, g++]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc clang g++

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Smoke-test the CLI
        run: |
          ./build/openfg-cli validate
          ./build/openfg-cli test mpv game.exe

      - name: Check the GUI syntax
        run: python3 -m py_compile gui/openfg-gui.py
